# TEMPORARY. Remove this file before the merge of PR #646 (branch
# github-actions-ci).
#
# The CI workflow stops at the first crate that fails clippy, and it runs no
# test until clippy passes. This survey finds each clippy error and each test
# failure on Linux and on macOS in one run, so that one branch can fix all of them.
name: Survey

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  survey:
    name: Survey (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libasound2-dev libssl-dev pkg-config

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Show the git configuration and the environment
        run: |
          git config --list --show-origin --show-scope || true
          env | grep -E "^(GIT|COLOR|TERM|CI=|LANG|LC_|HOME)" | sort || true

      - name: Clippy, all errors
        continue-on-error: true
        run: cargo clippy --keep-going --all-targets --workspace -- -D warnings

      - name: Tests, all failures
        env:
          CLICOLOR_FORCE: "1"
          COLORTERM: truecolor
        run: cargo test --workspace --no-fail-fast
