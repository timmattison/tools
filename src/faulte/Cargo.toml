[package]
name = "faulte"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Fault rate: rank the processes of a Mac by page faults per second, and stop old idle Claude Code sessions"

[lib]
name = "faulte"
path = "src/lib.rs"

[[bin]]
name = "faulte"
path = "src/main.rs"

[dependencies]
buildinfo.workspace = true
childenv.workspace = true
chrono.workspace = true
clap.workspace = true
comfy-table.workspace = true
crossterm.workspace = true
occ.workspace = true
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
termsize.workspace = true
textfit.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
altscreen = { workspace = true, features = ["ratatui"] }
libc.workspace = true
signal-hook.workspace = true

[dev-dependencies]
shellquote.workspace = true
testcolor.workspace = true

[lints]
workspace = true
