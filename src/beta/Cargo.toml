[package]
name = "beta"
version = "0.1.0"
edition = "2021"

[dependencies]
altscreen.workspace = true
anyhow = "1.0"
childenv.workspace = true
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.9.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
chrono = "0.4"
flate2 = "1.0"
tempfile.workspace = true  # Chapters file for video export

# Export functionality dependencies
minijinja = "2.0"          # Template engine for web export
base64 = "0.22"            # Data embedding for web export
image = "0.25"             # Image generation for video export
imageproc = "0.25.0"         # Image processing for video export
ab_glyph = "0.2"           # Font rendering for video export (replaces rusttype)
signal-hook.workspace = true # Signal handling for graceful termination
termsize.workspace = true    # The one reader of the terminal size, which takes a zero as no answer
termstate.workspace = true  # The terminal emulator, shared with nle

[dev-dependencies]
# The tests write the fake `ffmpeg` with
# `gitscratch::testing::executable::write_executable`, because a stub that
# `std::fs::write` writes can fail to run with ETXTBSY on Linux.
gitscratch = { workspace = true, features = ["testing"] }
# The tests give each run its own temporary directory, so parallel runs never collide.
tempfile.workspace = true

[lints]
workspace = true
