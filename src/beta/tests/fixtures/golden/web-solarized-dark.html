<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>golden</title>
    <!-- xterm.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <!-- pako for decompression if needed -->
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .terminal-container {
            background-color: #002b36;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        #terminal {
            width: 100%;
            height: 600px;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        .controls button {
            background-color: #4a4a4a;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
        }
        .controls button:hover {
            background-color: #5a5a5a;
        }
        .controls button:disabled {
            background-color: #2a2a2a;
            cursor: not-allowed;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: #333;
            border-radius: 2px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #007acc;
            width: 0%;
            transition: width 0.1s ease;
        }
        .time-display {
            text-align: center;
            margin: 10px 0;
            font-size: 12px;
            color: #888;
        }
        .speed-control {
            margin: 10px 0;
            text-align: center;
        }
        .speed-control select {
            background-color: #4a4a4a;
            color: white;
            border: 1px solid #666;
            padding: 5px 10px;
            border-radius: 3px;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>golden</h1>
            <p>Duration: 0.5s | 5 events</p>
        </div>
        
        <div class="terminal-container">
            <div id="terminal"></div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
            
            <div class="time-display">
                <span id="current-time">0:00</span> / <span id="total-time">0:00</span>
            </div>
            
            <div class="controls">
                <button id="play-pause">▶️ Play</button>
                <button id="restart">⏮️ Restart</button>
                <button id="step-back">⏪ -5s</button>
                <button id="step-forward">⏩ +5s</button>
            </div>
            
            <div class="speed-control">
                Speed: 
                <select id="speed">
                    <option value="0.25">0.25x</option>
                    <option value="0.5">0.5x</option>
                    <option value="1" selected>1x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>
                    <option value="3">3x</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        class TerminalPlayer {
            constructor(recording) {
                this.recording = recording;
                this.events = recording.events;
                this.currentEventIndex = 0;
                this.isPlaying = false;
                this.playbackSpeed = 1.0;
                this.startTime = null;
                this.pausedAt = 0;
                
                // Initialize xterm.js
                this.terminal = new Terminal({
                    cols: recording.width,
                    rows: recording.height,
                    theme: {
                        background: '#002b36',
                        foreground: '#839496',
                        cursor: '#839496',
                        black: '#073642',
                        red: '#dc322f',
                        green: '#859900',
                        yellow: '#b58900',
                        blue: '#268bd2',
                        magenta: '#d33682',
                        cyan: '#2aa198',
                        white: '#eee8d5',
                        brightBlack: '#002b36',
                        brightRed: '#cb4b16',
                        brightGreen: '#586e75',
                        brightYellow: '#657b83',
                        brightBlue: '#839496',
                        brightMagenta: '#6c71c4',
                        brightCyan: '#93a1a1',
                        brightWhite: '#fdf6e3'
                    },
                    fontFamily: '"JetBrains Mono", "Monaco", "Menlo", "Ubuntu Mono", monospace',
                    fontSize: 14,
                    lineHeight: 1.2,
                    cursorBlink: false,
                    disableStdin: true,
                    allowProposedApi: true
                });
                
                // Initialize fit addon
                this.fitAddon = new FitAddon.FitAddon();
                this.terminal.loadAddon(this.fitAddon);
                
                // Open terminal in the DOM
                this.terminal.open(document.getElementById('terminal'));
                this.fitAddon.fit();
                
                // Get DOM elements
                this.playPauseBtn = document.getElementById('play-pause');
                this.progressBar = document.getElementById('progress');
                this.currentTimeDisplay = document.getElementById('current-time');
                this.speedSelect = document.getElementById('speed');
                
                this.bindEvents();
                this.updateDisplay();
            }
            
            bindEvents() {
                this.playPauseBtn.addEventListener('click', () => this.togglePlayPause());
                document.getElementById('restart').addEventListener('click', () => this.restart());
                document.getElementById('step-back').addEventListener('click', () => this.stepBack());
                document.getElementById('step-forward').addEventListener('click', () => this.stepForward());
                this.speedSelect.addEventListener('change', (e) => {
                    this.playbackSpeed = parseFloat(e.target.value);
                });
                
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.togglePlayPause();
                    } else if (e.code === 'ArrowLeft') {
                        e.preventDefault();
                        this.stepBack();
                    } else if (e.code === 'ArrowRight') {
                        e.preventDefault();
                        this.stepForward();
                    }
                });
                
                // Handle window resize
                window.addEventListener('resize', () => {
                    this.fitAddon.fit();
                });
            }
            
            togglePlayPause() {
                if (this.isPlaying) {
                    this.pause();
                } else {
                    this.play();
                }
            }
            
            play() {
                this.isPlaying = true;
                this.playPauseBtn.textContent = '⏸️ Pause';
                this.startTime = Date.now() - this.pausedAt * 1000;
                this.animate();
            }
            
            pause() {
                this.isPlaying = false;
                this.playPauseBtn.textContent = '▶️ Play';
                this.pausedAt = this.getCurrentTime();
            }
            
            restart() {
                const wasPlaying = this.isPlaying;
                this.pause();
                this.currentEventIndex = 0;
                this.pausedAt = 0;
                this.terminal.reset();
                this.terminal.clear();
                this.updateDisplay();
                if (wasPlaying) {
                    this.play();
                }
            }
            
            stepBack() {
                const targetTime = Math.max(0, this.getCurrentTime() - 5);
                this.seekTo(targetTime);
            }
            
            stepForward() {
                const targetTime = Math.min(this.recording.duration, this.getCurrentTime() + 5);
                this.seekTo(targetTime);
            }
            
            seekTo(time) {
                const wasPlaying = this.isPlaying;
                this.pause();
                
                this.currentEventIndex = 0;
                this.terminal.reset();
                this.terminal.clear();
                
                // Replay all events up to the target time
                for (let i = 0; i < this.events.length; i++) {
                    if (this.events[i].time <= time) {
                        if (this.events[i].type === 'o') {
                            this.terminal.write(this.events[i].data);
                        }
                        this.currentEventIndex = i + 1;
                    } else {
                        break;
                    }
                }
                
                this.pausedAt = time;
                this.updateDisplay();
                
                if (wasPlaying) {
                    this.play();
                }
            }
            
            getCurrentTime() {
                if (this.isPlaying && this.startTime) {
                    return (Date.now() - this.startTime) / 1000 * this.playbackSpeed;
                }
                return this.pausedAt;
            }
            
            animate() {
                if (!this.isPlaying) return;
                
                const currentTime = this.getCurrentTime();
                
                while (this.currentEventIndex < this.events.length && 
                       this.events[this.currentEventIndex].time <= currentTime) {
                    const event = this.events[this.currentEventIndex];
                    if (event.type === 'o') {
                        this.terminal.write(event.data);
                    }
                    this.currentEventIndex++;
                }
                
                this.updateDisplay();
                
                if (this.currentEventIndex >= this.events.length) {
                    this.pause();
                    return;
                }
                
                requestAnimationFrame(() => this.animate());
            }
            
            updateDisplay() {
                const currentTime = this.getCurrentTime();
                const progress = (currentTime / this.recording.duration) * 100;
                this.progressBar.style.width = `${Math.min(100, progress)}%`;
                
                const minutes = Math.floor(currentTime / 60);
                const seconds = Math.floor(currentTime % 60);
                this.currentTimeDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }
        }
        
        const recording = {"version":2,"width":12,"height":4,"timestamp":1700000000.0,"duration":0.5,"command":"sh","title":"golden","env":{},"events":[{"time":0.0,"type":"o","data":"\u001b[1;31mbold red\u001b[0m\r\n"},{"time":0.0,"type":"i","data":"x"},{"time":0.0,"type":"o","data":"\u001b[92mgreen\u001b[0m \u001b[4mul\u001b[0m\r\n"},{"time":0.0,"type":"o","data":"\u001b[38;5;208m208\u001b[48;2;10;20;30m rgb\u001b[0m\r\n"},{"time":0.0,"type":"o","data":"\u001b]4;1;#123456\u0007\u001b[38;5;1mpal\u001b[0m $ "}]};
        const player = new TerminalPlayer(recording);
    </script>
</body>
</html>
