[package]
name = "repowalker"
version = "0.1.0"
edition.workspace = true

[dependencies]
# For `shed_inherited_git_environment`. This crate asks git which repository a
# directory belongs to, and an inherited `GIT_DIR` answers with a different
# repository. Which variables carry that danger is knowledge that lives in
# gitscratch rather than being copied here to drift.
gitscratch.workspace = true
ignore.workspace = true
walkdir.workspace = true

[dev-dependencies]
# The shared git fixtures, including the detached-git-directory layout that
# `find_repo_context_at` exists to read.
gitscratch = { workspace = true, features = ["testing"] }
tempfile.workspace = true

[lints]
workspace = true
