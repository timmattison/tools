[package]
name = "cwt"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "cwt"
path = "src/main.rs"

[dependencies]
buildinfo.workspace = true
clap.workspace = true
colored.workspace = true
# For `shed_inherited_git_environment_keeping_user_intent`: cwt asks git for the
# URL of `origin` and starts `gh`, and an inherited `GIT_DIR` would aim both at
# another repository. Which variables to shed is knowledge that lives in
# gitscratch rather than being copied here to drift.
gitscratch.workspace = true
repowalker.workspace = true
runlimit.workspace = true
# `serde` and `serde_json` read the JSON that `gh pr list --json` prints.
serde.workspace = true
serde_json.workspace = true
shellsetup.workspace = true

[dev-dependencies]
gitscratch = { workspace = true, features = ["testing"] }
tempfile.workspace = true
testcolor.workspace = true

[lints]
workspace = true
