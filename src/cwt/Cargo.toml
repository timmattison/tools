[package]
name = "cwt"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "cwt"
path = "src/main.rs"

[dependencies]
buildinfo.workspace = true
clap.workspace = true
colored.workspace = true
repowalker.workspace = true
# `serde` and `serde_json` read the JSON that `gh pr list --json` prints.
serde.workspace = true
serde_json.workspace = true
shellsetup.workspace = true

[dev-dependencies]
gitscratch = { workspace = true, features = ["testing"] }
tempfile.workspace = true
testcolor.workspace = true

[lints]
workspace = true
