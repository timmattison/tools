[package]
name = "glance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "A light macOS menu bar monitor of the CPU share and the memory pressure"

[lib]
name = "glance"
path = "src/lib.rs"

[[bin]]
name = "glance"
path = "src/main.rs"

[dependencies]
buildinfo.workspace = true
childenv.workspace = true
clap.workspace = true
shellquote.workspace = true
# The default parse of serde_json can be one unit in the last place off, and the parse of a printed sample must give the same sample.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[target.'cfg(target_os = "macos")'.dependencies]
dirs.workspace = true
libc.workspace = true
objc2.workspace = true
tempfile.workspace = true
objc2-app-kit = { workspace = true, features = [
    "std",
    "NSAppearance",
    "NSApplication",
    "NSBitmapImageRep",
    "NSColorSpace",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSScreen",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSButton",
    "NSRunningApplication",
    "objc2-core-foundation",
    "NSControl",
    "NSView",
    "NSAttributedString",
    "NSColor",
    "NSFont",
    "NSGraphicsContext",
    "NSParagraphStyle",
    "NSStringDrawing",
    "NSText",
] }
objc2-foundation = { workspace = true, features = [
    "std",
    "NSDistributedNotificationCenter",
    "NSTimer",
    "NSRunLoop",
    "NSDate",
    "NSString",
    "NSEnumerator",
    "NSDictionary",
    "NSAttributedString",
    "NSGeometry",
    "objc2-core-foundation",
] }

[dev-dependencies]
# `write_executable` writes the fake `ssh` of the tests. On Linux, a script
# that the test process held open for writing gives ETXTBSY at its run.
gitscratch = { workspace = true, features = ["testing"] }
tempfile.workspace = true
testcolor.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation = { workspace = true, features = ["CFRunLoop", "CFString"] }

[lints]
workspace = true
