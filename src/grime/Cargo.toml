[package]
name = "grime"
version = "0.1.0"
edition.workspace = true
# Not the sentence the doc comment on `Args` carries, and the difference is
# deliberate. This one is read on crates.io and in `cargo search`, by somebody
# who has run nothing, so `BRANCH` names nothing to them. The doc comment is
# what `--help` prints, where `BRANCH` is the argument the reader just typed.
description = "Reports whether merging a branch into HEAD would conflict, and by how much"

[dependencies]
anyhow.workspace = true
buildinfo.workspace = true
clap.workspace = true
# The paint of the halt diff that `--diff` prints. `gitscratch` paints it, and
# `colored` decides at format time whether to write the codes. This tool takes
# the crate to make one decision of its own at startup, through the global
# override: the rule of a wrapper, which `colored` cannot see.
colored.workspace = true
gitscratch.workspace = true
# The one entrance to the width of a terminal, and the one place that decides
# between the two sources of it. A width the environment states in `COLUMNS`
# wins, and the controlling terminal answers when the environment states none.
# A terminal that carries no window answers the `TIOCGWINSZ` ioctl with zero
# columns and the ioctl succeeds, so a caller that reads the raw answer lays the
# breakdown out at no columns at all. `TerminalWidth::get_or_default` is where
# that answer is refused and the fallback of 80 columns stands instead.
termbar.workspace = true
# Decides when a wrapper such as `viddy(1)` gives this tool a pipe and states a
# width in `COLUMNS`, so that the halt diff keeps its color on the terminal of
# the wrapper. The rule, and the two variables that refuse it, stand in one
# function there, so a fix to them reaches each tool that asks.
termwindow.workspace = true

[dev-dependencies]
gitscratch = { workspace = true, features = ["testing"] }
# Takes the color codes back out of a painted run, so a test compares the
# glyphs of the diff with the text of the same run with `NO_COLOR`. One
# stripper for the whole workspace, because two hand-written strippers agree
# on the common sequences and part company on the rare ones.
testcolor.workspace = true
# So a test asserting that a column lines up measures the same thing the
# renderer does. Byte length and character count both disagree with what a
# terminal shows for a CJK name, and a test using either would call a ragged
# column aligned.
unicode-width.workspace = true

[lints]
workspace = true
