[package]
name = "cctop"
version = "0.1.0"
edition.workspace = true
description = "Claude Code top: a terminal view of the state of each Claude Code session, which focuses the session that needs you"
license = "MIT"

[lib]
name = "cctop"
path = "src/lib.rs"

[[bin]]
name = "cctop"
path = "src/main.rs"

[dependencies]
altscreen = { workspace = true, features = ["ratatui"] }
base64.workspace = true
buildinfo.workspace = true
chrono.workspace = true
childenv.workspace = true
clap.workspace = true
crossterm.workspace = true
notify.workspace = true
proctree.workspace = true
ratatui.workspace = true
runlimit.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
unicode-width.workspace = true

[lints]
workspace = true
