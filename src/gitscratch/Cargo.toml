[package]
name = "gitscratch"
version = "0.1.0"
edition.workspace = true
description = "The hardened scratch-worktree harness for dry-running git operations without touching a real repository"

[dependencies]
anyhow.workspace = true
colored.workspace = true
# The pseudo-terminal of the tests, in `testing::pty`, and nothing else. A test
# of a tool that lays text out for a terminal opens a terminal of a size it
# chose, and the standard library has no call for `openpty` or for
# `TIOCSCTTY`. Optional, so a build without the `testing` feature holds none of
# it.
libc = { workspace = true, optional = true }
tempfile.workspace = true
unicode-width.workspace = true

[dev-dependencies]
# Depending on itself turns the `testing` feature on for this crate's own test
# targets, so `cargo test -p gitscratch` compiles the safety suite without
# anyone having to remember `--features testing`. Cargo permits this one cycle
# precisely so a crate can enable its own optional test scaffolding.
gitscratch = { path = ".", features = ["testing"] }
# Locates the headings that bound the README sections `src/git.rs` checks
# itself against. A dev-dependency only, so nothing a consumer ships gains a
# markdown parser.
pulldown-cmark.workspace = true
# Forces the color codes on for one test body, under the one lock on the
# global override of `colored`, and takes the codes back out. The tests of
# the painter read what `render_diffs` writes through it.
testcolor.workspace = true

[features]
# Shared git fixture builders for the test suites of crates built on gitscratch,
# and the pseudo-terminal that the tests of `grind` and `grime` share.
testing = ["dep:libc"]

[lints]
workspace = true
