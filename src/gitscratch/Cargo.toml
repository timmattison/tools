[package]
name = "gitscratch"
version = "0.1.0"
edition.workspace = true
description = "The hardened scratch-worktree harness for dry-running git operations without touching a real repository"

[dependencies]
anyhow.workspace = true
childenv.workspace = true
colored.workspace = true
# The pseudo-terminal of the tests, in `testing::pty`, and nothing else. A test
# of a tool that lays text out for a terminal opens a terminal of a size it
# chose, and the standard library has no call for `openpty` or for
# `TIOCSCTTY`. Optional, so a build without the `testing` feature holds none of
# it.
libc = { workspace = true, optional = true }
# The progress display of `Console`, behind the `progress` feature. It draws a
# spinner and a bar on standard error while a replay runs. Optional, because
# `grist` prints no breakdown and no display, and must not pay for it.
indicatif = { workspace = true, optional = true }
# Quotes each value that the `git` shim of `testing::git_shim` puts into its
# script. Optional, so a build without the `testing` feature holds none of it.
shellquote = { workspace = true, optional = true }
tempfile.workspace = true
# The width of the terminal and the block elements of the progress bar, behind
# the `progress` feature, for the same reason as `indicatif`. The display reads
# the width through this crate, and not through `indicatif`, so that every
# tool of the workspace measures a terminal the one way.
termbar = { workspace = true, optional = true }
unicode-width.workspace = true

[dev-dependencies]
# Depending on itself turns the `testing` and `progress` features on for this
# crate's own test targets, so `cargo test -p gitscratch` compiles the safety
# suite and the display tests without anyone having to remember a feature.
# Cargo permits this one cycle precisely so a crate can enable its own
# optional test scaffolding.
gitscratch = { path = ".", features = ["testing", "progress"] }
# Locates the headings that bound the README sections `src/git.rs` checks
# itself against. A dev-dependency only, so nothing a consumer ships gains a
# markdown parser.
pulldown-cmark.workspace = true
# Forces the color codes on for one test body, under the one lock on the
# global override of `colored`, and takes the codes back out. The tests of
# the painter read what `render_diffs` writes through it.
testcolor.workspace = true

[features]
# Shared git fixture builders for the test suites of crates built on gitscratch,
# the pseudo-terminal, the `git` shim that the tests of `grind` and `grime`
# share, and the writer of the executable stubs that a test runs.
testing = ["dep:libc", "dep:shellquote"]
# The progress display of `Console`. It is off by default, because it needs the
# size of the terminal, and `grist` must not carry that dependency.
progress = ["dep:indicatif", "dep:termbar"]

[lints]
workspace = true
