[package]
name = "cctop-bar"
version = "0.1.0"
edition.workspace = true
description = "A macOS menu-bar mini-map of the Claude Code sessions, with a hotkey that opens cctop in a floating panel"
license = "MIT"

[lib]
name = "cctop_bar"
path = "src/lib.rs"

[[bin]]
name = "cctop-bar"
path = "src/main.rs"

[dependencies]
buildinfo.workspace = true
cctop.workspace = true
clap.workspace = true
crossterm.workspace = true
ratatui.workspace = true
thiserror.workspace = true
unicode-width.workspace = true

[dev-dependencies]
childenv.workspace = true
testcolor.workspace = true

[lints]
workspace = true
