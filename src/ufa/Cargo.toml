[package]
name = "ufa"
version = "0.1.0"
edition = "2021"

[dependencies]
# Inherited from the workspace. `features` here are additive on top of the
# workspace's own feature list, for the features only ufa needs.
anyhow.workspace = true
buildinfo.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["env"] }
dirs.workspace = true
futures.workspace = true
indicatif.workspace = true
op-cache.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["serde"] }

# Crate-local: the workspace does not define these.
dotenvy = "0.15"
mdns-sd = "0.11"
open = "5.3"
tabled = "0.20.0"

# Crate-local deliberately: the workspace's reqwest keeps default features
# (native-tls). ufa talks to controllers over rustls only, and
# `default-features = false` cannot be expressed against an inherited
# dependency that enables them.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[lints]
workspace = true
