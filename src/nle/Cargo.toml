[package]
name = "nle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Non-linear editor for terminal recordings"

[lib]
name = "nle_lib"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
flate2 = "1.0"
buildinfo = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
# Every child process starts through childenv::command, because clippy.toml
# bans std::process::Command::new.
childenv = { workspace = true }

[dev-dependencies]
toml = { workspace = true }

[lints]
workspace = true
