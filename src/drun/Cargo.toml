[package]
name = "drun"
version = "0.1.0"
edition.workspace = true
description = "Runs a Docker container on the least busy of your Docker hosts, and finds it again later"

[[bin]]
name = "drun"
path = "src/main.rs"

[dependencies]
buildinfo.workspace = true
childenv.workspace = true
names.workspace = true
runlimit.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
unicode-width.workspace = true

[dev-dependencies]
# The tests write the fake `docker` with
# `gitscratch::testing::executable::write_executable`, because a stub that
# `std::fs::write` writes can fail to run with ETXTBSY on Linux.
gitscratch = { workspace = true, features = ["testing"] }
shellquote.workspace = true
tempfile.workspace = true

[lints]
workspace = true
