[package]
name = "repo-guards"
version = "0.1.0"
edition.workspace = true

[dependencies]
glob.workspace = true
proc-macro2.workspace = true
pulldown-cmark.workspace = true
# The doc-links guard parses the JSON Lines that `cargo doc` writes, so this is
# library code rather than test scaffolding. It stays available to the tests.
serde_json.workspace = true
syn.workspace = true
thiserror.workspace = true
toml.workspace = true
# Walks each workspace member for Rust source, so the git-environment guard
# reads every file rather than only the target roots its siblings enumerate.
walkdir.workspace = true

[dev-dependencies]
# For `shed_inherited_git_environment`: the hook tests spawn git and the real
# pre-commit hook, and a run from inside a git hook inherits an environment
# aimed at the repository being committed to. Which variables those are is
# knowledge that lives in gitscratch rather than being copied here to drift.
gitscratch.workspace = true
tempfile.workspace = true

[lints]
workspace = true
