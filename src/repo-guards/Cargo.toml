[package]
name = "repo-guards"
version = "0.1.0"
edition.workspace = true

[dependencies]
childenv.workspace = true
glob.workspace = true
proc-macro2.workspace = true
pulldown-cmark.workspace = true
# The doc-links guard parses the JSON Lines that `cargo doc` writes, so this is
# library code rather than test scaffolding. It stays available to the tests.
serde_json.workspace = true
syn.workspace = true
thiserror.workspace = true
toml.workspace = true
# Walks each workspace member for Rust source, so the git-environment guard
# reads every file rather than only the target roots its siblings enumerate.
walkdir.workspace = true

[dev-dependencies]
# The hook tests write the check script and a stub cargo-machete into each
# fixture with `gitscratch::testing::executable::write_executable`, because a
# process runs each of them. They copy the helper that the check script sources
# with `fs::copy`, because no process runs it.
gitscratch = { workspace = true, features = ["testing"] }
tempfile.workspace = true

[lints]
workspace = true
