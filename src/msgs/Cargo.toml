[package]
name = "msgs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

# `tauri-runtime` and `tauri-utils` are in the list only to apply their `~2.9`
# pins from the root Cargo.toml. No code of msgs names them, so cargo-machete
# reports them as unused.
[package.metadata.cargo-machete]
ignored = ["tauri-runtime", "tauri-utils"]

[dependencies]
tauri.workspace = true
# Pins only. See the Tauri block of the root Cargo.toml.
tauri-runtime.workspace = true
tauri-utils.workspace = true
tauri-plugin-dialog.workspace = true
rusqlite.workspace = true
specta.workspace = true
buildinfo.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
log.workspace = true
env_logger.workspace = true
dirs.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
# The row trace lets a test write to chat.db between two reads.
rusqlite = { workspace = true, features = ["trace"] }
tempfile.workspace = true
childenv.workspace = true
# A zone with summer time, for the tests of the offset of each date.
chrono-tz.workspace = true
specta-typescript.workspace = true
# The lockfile test reads Cargo.lock and pnpm-lock.yaml.
toml.workspace = true
yaml-rust2.workspace = true

[lints]
workspace = true
