[package]
name = "swt"
version = "0.1.0"
edition.workspace = true

[lib]
name = "swt"
path = "src/lib.rs"

[[bin]]
name = "swt"
path = "src/main.rs"

[dependencies]
buildinfo.workspace = true
clap.workspace = true
serde_json.workspace = true
shellquote.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[dev-dependencies]
# The unit tests ask git whether it accepts a branch name. A pre-commit hook
# exports its git environment into the tests that it runs, and the rule for
# which variables to shed lives in gitscratch, not in a copy here.
gitscratch.workspace = true
libc.workspace = true
regex.workspace = true
tempfile.workspace = true
testcolor.workspace = true

[lints]
workspace = true
