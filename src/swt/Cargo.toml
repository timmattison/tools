[package]
name = "swt"
version = "0.1.0"
edition.workspace = true

[lib]
name = "swt"
path = "src/lib.rs"

[[bin]]
name = "swt"
path = "src/main.rs"

[dependencies]
buildinfo.workspace = true
childenv.workspace = true
clap.workspace = true
serde_json.workspace = true
shellquote.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[dev-dependencies]
# The shared git fixtures. `tests/hostile-git-environment.rs` takes its decoy
# repository from them.
gitscratch = { workspace = true, features = ["testing"] }
libc.workspace = true
regex.workspace = true
tempfile.workspace = true
testcolor.workspace = true

[lints]
workspace = true
