[package]
name = "nwt"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "nwt"
path = "src/main.rs"

[dependencies]
buildinfo.workspace = true
clap.workspace = true
dirs.workspace = true
names.workspace = true
repowalker.workspace = true
serde.workspace = true
serde_json.workspace = true
shellsetup.workspace = true
toml.workspace = true
walkdir.workspace = true

[dev-dependencies]
# For `shed_inherited_git_environment`: the suite spawns git and the real nwt
# binary, and a run from inside a git hook inherits an environment aimed at the
# repository being committed to. Which variables those are is knowledge that
# lives in gitscratch rather than being copied here to drift.
#
# The `testing` feature carries the shared git fixture builders, and
# `tests/detached-git-dir.rs` builds its repositories with `DetachedGitDirRepo`.
gitscratch = { workspace = true, features = ["testing"] }
tempfile.workspace = true

[lints]
workspace = true
