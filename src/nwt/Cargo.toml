[package]
name = "nwt"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "nwt"
path = "src/main.rs"

[dependencies]
buildinfo.workspace = true
childenv.workspace = true
clap.workspace = true
dirs.workspace = true
names.workspace = true
repowalker.workspace = true
serde.workspace = true
serde_json.workspace = true
shellquote.workspace = true
shellsetup.workspace = true
toml.workspace = true
walkdir.workspace = true

[dev-dependencies]
# The `testing` feature carries the shared git fixture builders, and
# `tests/detached-git-dir.rs` builds its repositories with `DetachedGitDirRepo`.
gitscratch = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# For `strip_ansi`: clap paints its usage errors when `CLICOLOR_FORCE` is set,
# and `tests/tmux-removed.rs` compares the glyphs of one. See "Colored Output in
# Tests" in CLAUDE.md.
testcolor.workspace = true

[lints]
workspace = true
