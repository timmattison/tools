[package]
name = "ic"
version = "0.1.0"
edition.workspace = true
description = "Fast terminal image display utility for iTerm2, similar to imgcat"

[[bin]]
name = "ic"
path = "src/main.rs"

[dependencies]
altscreen.workspace = true
anyhow.workspace = true
base64.workspace = true
buildinfo.workspace = true
childenv.workspace = true
clap.workspace = true
image.workspace = true
notify.workspace = true
proctree.workspace = true
termion.workspace = true
termgfx.workspace = true
unicode-width.workspace = true

[dev-dependencies]
gitscratch = { workspace = true, features = ["testing"] }
libc.workspace = true
serde_json.workspace = true

[lints]
workspace = true
