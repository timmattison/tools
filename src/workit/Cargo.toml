[package]
name = "workit"
version = "0.1.0"
edition.workspace = true
description = "Find every Cargo.toml under a directory and write a workspace manifest that lists them as members"

[dependencies]
anyhow.workspace = true
buildinfo.workspace = true
clap.workspace = true
toml_edit.workspace = true
walkdir.workspace = true

[dev-dependencies]
# The one rule for shedding an inherited git environment. `tests/worktree.rs`
# builds real repositories and real worktrees, and a `GIT_DIR` inherited from a
# pre-commit hook outranks both the working directory and `git -C`.
gitscratch.workspace = true
regex.workspace = true
tempfile.workspace = true

[lints]
workspace = true
