[workspace]
resolver = "2"
members = ["src/*"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Tim Mattison"]

[workspace.dependencies]
# Error handling
anyhow = "1.0"
thiserror = "2.0"

# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# AWS SDK
aws-config = "1.8"
aws-credential-types = "1.2"
aws-sdk-iot = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.80", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
aws-sigv4 = "1.5"

# MQTT
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls", "websocket"] }

# File system
walkdir = "2.5"
ignore = "0.4"
dirs = "6.0"
glob = "0.3"
notify = "8.2"

# Git
git2 = "0.20"
gix = "0.83"

# Hashing
blake3 = "1.8"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"

# Compression
flate2 = "1.1"

# Terminal UI
crossterm = "0.29"
ratatui = "0.30"
colored = "3.1"
comfy-table = "7.2"
indicatif = "0.18"
dialoguer = "0.11"
terminal_size = "0.4"
termion = "4.0"
portable-pty = "0.9.0"

# Clipboard
arboard = "3.6"

# Networking
reqwest = { version = "0.12", features = ["json", "stream"] }
tiny_http = "0.12"
url = "2.5"
percent-encoding = "2.3"

# Network tracing
# The documentation of `trippy-core` says that its public API is not stable and
# is highly likely to change, so the version is pinned exactly. `src/krt` holds
# every mention of a trippy type in one module, and `repo_guards::trippy_wall`
# keeps it there, so an upgrade breaks one file.
trippy-core = "=0.13.0"
trippy-dns = "0.13.0"
trippy-privilege = "0.13.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
chrono-english = "0.1"

# Concurrency
rayon = "1.11"
crossbeam = "0.8"
parking_lot = "0.12"

# Image processing
image = "0.25"
qrcode = "0.14"
base64 = "0.22"
icy_sixel = "0.5"

# Random
rand = "0.9"
names = { version = "0.14", default-features = false }
uuid = { version = "1", features = ["v4", "v5"] }

# System info
sysinfo = "0.36"
libc = "0.2"
signal-hook = "0.3"
which = "8.0"
listeners = "0.2"
get_if_addrs = "0.5"

# Memory mapping
memmap2 = "0.9"

# Audio
rodio = { version = "0.20", default-features = false, features = ["wav"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Misc
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit"] }
proc-macro2 = "1"
# CommonMark parser. Default features off: only the parser is wanted, not the
# `getopts` binary or the `html` renderer.
pulldown-cmark = { version = "0.13", default-features = false }
tiktoken-rs = "0.5"
num-format = "0.4"
human_bytes = "0.4"
unicode-width = "0.2"
regex = "1.12"
wait-timeout = "0.2"
memchr = "2.8"
globset = "0.4"
csv = "1.4"

# Source parsing
#
# `src/cdva` asks each file "does this line belong to a test?". That question
# names a syntactic category, so it needs a parser and not a regular
# expression. Every grammar below is a C crate, and every one of them was
# measured against `tree-sitter` 0.26: the ABI versions differ between
# grammars, and the runtime accepts both 14 and 15.
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-elixir = "0.3"
tree-sitter-zig = "1.1"

# Dev dependencies
tempfile = "3"
mockito = "1.7"
tokio-tungstenite = "0.30"

# Platform-specific
procfs = "0.17"
core-foundation = "0.10"
core-foundation-sys = "0.8"
io-kit-sys = "0.5"
windows-sys = { version = "0.60", features = [
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading"
] }

# Internal crates
buildinfo = { path = "src/buildinfo" }
op-cache = { path = "src/op-cache" }
clipboardmon = { path = "src/clipboardmon" }
filewalker = { path = "src/filewalker" }
gitscratch = { path = "src/gitscratch" }
httpfile = { path = "src/httpfile" }
portplz-core = { path = "src/portplz-core" }
repowalker = { path = "src/repowalker" }
shellsetup = { path = "src/shellsetup" }
termbar = { path = "src/termbar" }
termgfx = { path = "src/termgfx" }
termsize = { path = "src/termsize" }
termwindow = { path = "src/termwindow" }
testcolor = { path = "src/testcolor" }
textfit = { path = "src/textfit" }

[workspace.lints.rust]
# Require explicit handling of must-use values
unused_must_use = "warn"

[workspace.lints.clippy]
# Catch potential issues with number literals that could be constants
unreadable_literal = "warn"
# Warn on functions with many arguments (consider refactoring)
too_many_arguments = "warn"
# Warn on large enum variants that could impact performance
large_enum_variant = "warn"
# Catch potential issues with casts
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
# Documentation quality
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# FFI safety: require explicit handling of unsafe blocks
undocumented_unsafe_blocks = "warn"
# Catch numeric literals that should use type suffixes for clarity
unseparated_literal_suffix = "warn"
# Prevent holding locks across await points (potential deadlocks)
await_holding_lock = "warn"
# Prevent suppressing warnings without explanation
allow_attributes_without_reason = "warn"
# Catch clones that can be replaced by moves (nursery lint, may have false positives)
redundant_clone = "warn"
# Warn on byte-level string indexing (&s[..n]) which can panic on multi-byte UTF-8
string_slice = "warn"
# A banned method is a hard error, not a warning. The ban is how the workspace
# makes a helper mandatory, and a warning is something a plain `cargo clippy`
# run prints and a reader skips. The banned methods are listed in the
# clippy.toml beside this manifest, which covers every member.
disallowed_methods = "deny"
