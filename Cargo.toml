[workspace]
resolver = "2"
members = ["src/*"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Tim Mattison"]

[workspace.dependencies]
# Error handling
anyhow = "1.0"
thiserror = "2.0"

# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
yaml-rust2 = "0.12"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# AWS SDK
aws-config = "1.8"
aws-credential-types = "1.2"
aws-sdk-iot = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.80", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
aws-sigv4 = "1.5"

# MQTT
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls", "websocket"] }

# File system
walkdir = "2.5"
ignore = "0.4"
dirs = "6.0"
glob = "0.3"
notify = "8.2"

# Git
# vendored-libgit2 compiles the bundled libgit2 and links it statically. A
# system libgit2 puts its version-pinned Homebrew Cellar path in the build
# cache, and each Homebrew upgrade then stops the link. The default ssh and
# https transports are off, because no crate clones or fetches, and ssh links
# the Homebrew OpenSSL dylib. Held by src/gitrdun/tests/vendored-libgit2.rs.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
gix = "0.83"

# Hashing
blake3 = "1.8"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"

# Compression
flate2 = "1.1"

# Terminal UI
crossterm = "0.29"
ratatui = "0.30"
colored = "3.1"
comfy-table = "7.2"
indicatif = "0.18"
dialoguer = "0.11"
terminal_size = "0.4"
termion = "4.0"
portable-pty = "0.9.0"

# Clipboard
arboard = "3.6"

# Networking
reqwest = { version = "0.12", features = ["json", "stream"] }
tiny_http = "0.12"
url = "2.5"
percent-encoding = "2.3"

# Network tracing
# The documentation of `trippy-core` says that its public API is not stable and
# is highly likely to change, so the version is pinned exactly. `src/krt` holds
# every mention of a trippy type in one module, and `repo_guards::trippy_wall`
# keeps it there, so an upgrade breaks one file.
trippy-core = "=0.13.0"
trippy-dns = "0.13.0"
trippy-privilege = "0.13.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
chrono-english = "0.1"
# The IANA time zone database, for tests that need a zone with summer time
# without a change to TZ for the whole process.
chrono-tz = "0.10.4"

# Concurrency
rayon = "1.11"
crossbeam = "0.8"
parking_lot = "0.12"

# Image processing
image = "0.25"
png = "0.18"
qrcode = "0.14"
base64 = "0.22"
icy_sixel = "0.5"

# Random
rand = "0.9"
names = { version = "0.14", default-features = false }
uuid = { version = "1", features = ["v4", "v5"] }

# System info
sysinfo = "0.36"
libc = "0.2"
signal-hook = "0.3"
which = "8.0"
listeners = "0.2"
get_if_addrs = "0.5"

# Memory mapping
memmap2 = "0.9"

# Audio
rodio = { version = "0.20", default-features = false, features = ["wav"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Browser
open = "5.4"
# Splits a command line into words by the rules of a POSIX shell.
shlex = "2"

# Misc
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit"] }
proc-macro2 = "1"
# CommonMark parser. Default features off: only the parser is wanted, not the
# `getopts` binary or the `html` renderer.
pulldown-cmark = { version = "0.13", default-features = false }
tiktoken-rs = "0.5"
num-format = "0.4"
human_bytes = "0.4"
unicode-width = "0.2"
unicode-segmentation = "1.13"
regex = "1.12"
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
wait-timeout = "0.2"
memchr = "2.8"
# Multi-pattern substring search; the crap fork scan
aho-corasick = "1.1"
globset = "0.4"
csv = "1.4"

# Source parsing
#
# `src/cdva` asks each file "does this line belong to a test?". That question
# names a syntactic category, so it needs a parser and not a regular
# expression. Every grammar below is a C crate, and every one of them was
# measured against `tree-sitter` 0.26: the ABI versions differ between
# grammars, and the runtime accepts both 14 and 15.
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-elixir = "0.3"
tree-sitter-zig = "1.1"
#
# The shell parser of `wdid`. `wdid` asks which word of a command line is in
# command position, and that question names a syntactic category, so it needs a
# parser. Measured on 2026-10-14 against 347,081 rows of a real atuin history:
# `brush-parser` 0.4.0 refused 27 rows, and `yash-syntax` 0.25.0 refused 185
# rows (it has no process substitution). `yash-syntax` is also GPL-3.0, and this
# workspace is MIT.
brush-parser = "0.4"

# Dev dependencies
tempfile = "3"
mockito = "1.7"
tokio-tungstenite = "0.30"
# The MQTT packet reader and writer of `rumqttc` take a `bytes::BytesMut`, and
# `rumqttc` re-exports neither the type nor the crate. A test that speaks MQTT
# to the code under test therefore names `bytes` itself.
bytes = "1"

# Platform-specific
procfs = "0.17"
core-foundation = "0.10"
core-foundation-sys = "0.8"
io-kit-sys = "0.5"
# objc2 bindings to the frameworks of Apple. They ship generated bindings, so
# the build needs no bindgen and no libclang. A member turns on only the
# features that it uses.
#
# Core Audio bindings for popstop.
objc2-audio-toolbox = { version = "0.3.2", default-features = false }
objc2-core-audio = { version = "0.3.2", default-features = false }
objc2-core-audio-types = { version = "0.3.2", default-features = false }
# Core Foundation bindings for popstop and glance.
objc2-core-foundation = { version = "0.3.2", default-features = false }
# The runtime, AppKit, and Foundation bindings for glance.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
windows-sys = { version = "0.60", features = [
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading"
] }

# Tauri
#
# The `~2.9` pins hold msgs on the Tauri 2.9 line. One Cargo.lock cannot hold
# webkit2gtk 2.0.1 and 2.0.2, and the lock includes the Linux targets:
#
# - nle uses dioxus-desktop 0.7, which needs wry 0.53 and webkit2gtk =2.0.1.
# - tauri 2.10 and later need wry 0.54 or later, and webkit2gtk =2.0.2.
#
# tauri 2.9 uses tauri-runtime-wry 2.9, which uses wry 0.53. Two crates under
# tauri accept versions that do not compile with tauri 2.9.5, so each one has
# its own pin, and msgs names each one only to apply that pin:
#
# - tauri-runtime-wry 2.9.3 accepts tauri-runtime ^2.9.2, but it does not
#   compile against tauri-runtime 2.11.3 (E0046). The pin holds tauri-runtime
#   on the 2.9 line of tauri-runtime-wry.
# - tauri 2.9.5 accepts tauri-macros ^2.5.2, but it does not compile against
#   tauri-macros 2.7.6 (E0599). The 2.7 line of tauri-macros, tauri-codegen,
#   tauri-build, and tauri-plugin needs tauri-utils ~2.10, so the tauri-utils
#   pin holds all four on 2.6.
#
# tauri-plugin-dialog 2.7 and later need tauri ^2.10, so the tauri pin also
# holds the dialog plugin on 2.6.
#
# src/msgs/frontend/package.json pins @tauri-apps/api to ~2.9 and
# @tauri-apps/plugin-dialog to ~2.6, because the Tauri CLI refuses a build
# when a crate and its npm package differ in the minor version.
# src/msgs/tests/tauri-versions.rs holds that rule.
#
# Remove the pins and the two npm pins when a stable dioxus-desktop uses
# wry >= 0.54.
tauri = "~2.9"
tauri-runtime = "~2.9"
tauri-utils = "~2.9"
tauri-build = "2"
tauri-plugin-dialog = "2"

# SQLite: The "bundled" feature compiles SQLite from source with SQLITE_THREADSAFE=1,
# which enables multi-thread/serialized mode by default. There is no separate
# "multi-thread" feature in rusqlite -- bundled already guarantees that
# Connection is Send, which is required for Tauri's thread pool.
rusqlite = { version = "0.43", features = ["bundled"] }

# Type generation. The `specta::Type` derives on the msgs IPC types feed the
# TypeScript exporter below.
specta = { version = "=2.0.0-rc.22", features = ["derive", "chrono"] }
# TypeScript exporter for the specta types. It needs the pinned specta version.
specta-typescript = "=0.0.9"

# Internal crates
buildinfo = { path = "src/buildinfo" }
childenv = { path = "src/childenv" }
sysclip = { path = "src/sysclip" }
claude-transcript = { path = "src/claude-transcript" }
op-cache = { path = "src/op-cache" }
clipboardmon = { path = "src/clipboardmon" }
faulte = { path = "src/faulte" }
filewalker = { path = "src/filewalker" }
altscreen = { path = "src/altscreen" }
ghrest = { path = "src/ghrest" }
gitscratch = { path = "src/gitscratch" }
httpfile = { path = "src/httpfile" }
occ = { path = "src/occ" }
portplz-core = { path = "src/portplz-core" }
proctree = { path = "src/proctree" }
repowalker = { path = "src/repowalker" }
runlimit = { path = "src/runlimit" }
shellquote = { path = "src/shellquote" }
shellsetup = { path = "src/shellsetup" }
termbar = { path = "src/termbar" }
termgfx = { path = "src/termgfx" }
termsize = { path = "src/termsize" }
termstate = { path = "src/termstate" }
termwindow = { path = "src/termwindow" }
testcolor = { path = "src/testcolor" }
textfit = { path = "src/textfit" }

[workspace.lints.rust]
# Require explicit handling of must-use values
unused_must_use = "warn"

[workspace.lints.clippy]
# Catch potential issues with number literals that could be constants
unreadable_literal = "warn"
# Warn on functions with many arguments (consider refactoring)
too_many_arguments = "warn"
# Warn on large enum variants that could impact performance
large_enum_variant = "warn"
# Catch potential issues with casts
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
# Documentation quality
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# FFI safety: require explicit handling of unsafe blocks
undocumented_unsafe_blocks = "warn"
# Catch numeric literals that should use type suffixes for clarity
unseparated_literal_suffix = "warn"
# Prevent holding locks across await points (potential deadlocks)
await_holding_lock = "warn"
# Prevent suppressing warnings without explanation
allow_attributes_without_reason = "warn"
# Make each allowance check itself. An #[expect] warns when its lint stops firing, so a stale allowance fails clippy. Inner #![allow] attributes are not affected.
allow_attributes = "warn"
# Catch clones that can be replaced by moves (nursery lint, may have false positives)
redundant_clone = "warn"
# Warn on byte-level string indexing (&s[..n]) which can panic on multi-byte UTF-8
string_slice = "warn"
# A banned method is a hard error, not a warning. The ban is how the workspace
# makes a helper mandatory, and a warning is something a plain `cargo clippy`
# run prints and a reader skips. The banned methods are listed in the
# clippy.toml beside this manifest, which covers every member.
disallowed_methods = "deny"
