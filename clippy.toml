# The override of the `colored` crate is process-global, and `cargo test` runs
# the tests of one binary on many threads. A test that sets the override
# directly changes what an unrelated test sees, which makes failures that appear
# and disappear between runs. `testcolor::with_forced_ansi` holds the one lock
# on that global state and puts the override back, so it is the only entrance.
# These entries make the bypass fail the build instead of failing a test once a
# week.
#
# The override arrives in two spellings. The two free functions in
# `colored::control` are the usual one, but each of them only forwards to a
# method on the `SHOULD_COLORIZE` singleton, and that method is public too. A
# ban on the free functions alone therefore leaves the singleton open, and one
# call through it changes the same global state. All four spellings are banned
# for that reason.
#
# This file sits beside the workspace manifest, so the ban covers every member.
# It used to sit beside gsw's manifest and cover gsw alone, which left the same
# trap open for every other crate. cwt fell into it: two tests compared colored
# output against plain text, passed in a redirected run, and failed under a
# hand-typed `git commit`. Clippy reads the nearest clippy.toml and no other, so
# a member that must keep the raw call cannot narrow this file — it says so at
# the call site with an `#[allow]` and a reason, where a reader sees it.
disallowed-methods = [
    { path = "colored::control::set_override", reason = "call testcolor::with_forced_ansi instead; it holds the one lock on this process-global override" },
    { path = "colored::control::unset_override", reason = "testcolor::with_forced_ansi puts the override back on its own, on the panic path as well" },
    { path = "colored::control::ShouldColorize::set_override", reason = "the singleton reaches the same global state as the free function; call testcolor::with_forced_ansi instead" },
    { path = "colored::control::ShouldColorize::unset_override", reason = "the singleton reaches the same global state as the free function; testcolor::with_forced_ansi puts the override back on its own" },
    # A terminal answers the `TIOCGWINSZ` ioctl with the columns and the rows of
    # its window, and a terminal that carries no window answers that same ioctl
    # with two zeros. The ioctl succeeds either way, so neither crate below
    # calls the zero an error. `crossterm` hands it straight back as
    # `Ok((0, 0))`, and every caller that reads the answer then takes zero
    # columns as the width of a window and draws into nothing. `krt` printed a
    # table of three columns under such a terminal, where the same replay
    # through a pipe printed ten, and no line of the output said why. A
    # pseudo-terminal that nobody ever sized is such a terminal, and
    # `script -q /dev/null` makes one.
    #
    # `terminal_size` refuses a zero on Unix today and does not refuse one on
    # Windows, where it subtracts the edges of the console rectangle and puts no
    # limit under the difference. So the two crates disagree with each other,
    # and one of them disagrees with itself between two platforms. A caller
    # cannot know which of the four answers it holds without reading the source
    # of both crates.
    #
    # `termsize` is the one entrance, and it states the one rule: a size whose
    # columns or whose rows are zero is no answer. It keeps three probes apart,
    # because they read different file descriptors, and a caller that measures
    # one of them must not get another. `controlling_size` reads `/dev/tty`, and
    # it reads standard output when that open fails. `stdout_size` reads
    # standard output, then standard error, then standard input.
    # `drawing_window` reads one whole `winsize` off one file descriptor: the
    # columns, the rows and the pixel size of one window. It reads standard
    # output, then standard error, then standard input, and then `/dev/tty`.
    #
    # The raw ioctl is banned for the same reason. `TIOCGWINSZ` is the call
    # under all three probes, so a crate that sends it directly writes a fourth
    # probe that obeys none of the rules above. `termgfx` did exactly that. It
    # held its own `TIOCGWINSZ` ioctl on file descriptor 1 and took the pixel
    # size from there, and it took the cell counts from `stdout_size`. A tool
    # that draws a picture divides the pixels by the cells to measure a
    # character cell. That division only measures a cell when both halves come
    # off one descriptor. A run whose standard output is a pipe measured no
    # pixels at all and drew at a guess. GitHub issue #350 reports that defect.
    #
    # `termsize` holds the only read of a window this ban allows, and it says so
    # at the call site with an `#[allow]` and a reason. The one other call is a
    # different request: a test of `ic` sends `TIOCSCTTY`, which reads no window
    # and claims a controlling terminal for a child.
    { path = "crossterm::terminal::size", reason = "call termsize::controlling_size or termsize::controlling_columns instead; a terminal that carries no window answers this call with Ok((0, 0)), and zero columns is not a width" },
    { path = "terminal_size::terminal_size", reason = "call termsize::stdout_size or termsize::stdout_columns instead; this call hands a zero back on Windows, and zero columns is not a width" },
    { path = "libc::ioctl", reason = "call termsize::drawing_window instead; a raw TIOCGWINSZ on one file descriptor is the bypass that termgfx held, and GitHub issue #350 reports what it cost. An ioctl of another request says so at its call site with an #[allow]" },
]
